# Plantilla nfpm (https://nfpm.goreleaser.com). La procesa packaging/build.sh,
# que sustituye @VERSION@, @ARCH@, @EXTRA@, @WHEELS@, @MAINTAINER@, @VENDOR@, @HOMEPAGE@, @LICENSE@.
# Las rutas relativas son respecto a la raíz del repositorio.
name: storageweb
arch: "@ARCH@"
platform: linux
version: "@VERSION@"
version_schema: semver
release: "1"
section: web
priority: optional
maintainer: "@MAINTAINER@"
vendor: "@VENDOR@"
homepage: "@HOMEPAGE@"
license: "@LICENSE@"
description: |
  Servidor web para subir y descargar archivos.
  Login con usuarios locales, usuarios del sistema (PAM) y Microsoft Entra ID (SSO).
  Cada usuario dispone de su home y de rutas compartidas configurables.

overrides:
  deb:
    depends:
      - python3 (>= 3.9)
      - python3-venv
      - adduser | passwd
    recommends:
      - nginx
  rpm:
    depends:
      - python3 >= 3.9
      - shadow-utils
      - util-linux

contents:
  # Wheels de la aplicación y dependencias: postinstall los instala en /opt/storageweb/venv
  - src: "@WHEELS@/"
    dst: /opt/storageweb/wheels
    type: tree

  - src: "@EXTRA@/storageweb.service"
    dst: /usr/lib/systemd/system/storageweb.service
    file_info:
      mode: 0644

  # Copias de seguridad diarias: se instalan desactivadas (systemctl enable --now storageweb-backup.timer)
  - src: "@EXTRA@/storageweb-backup.service"
    dst: /usr/lib/systemd/system/storageweb-backup.service
    file_info:
      mode: 0644

  - src: "@EXTRA@/storageweb-backup.timer"
    dst: /usr/lib/systemd/system/storageweb-backup.timer
    file_info:
      mode: 0644

  - src: "@EXTRA@/storageweb-admin"
    dst: /usr/bin/storageweb-admin
    file_info:
      mode: 0755

  - src: config/config.example.json
    dst: /etc/storageweb/config.json
    type: config|noreplace
    file_info:
      mode: 0640

  - src: config/config.example.json
    dst: /usr/share/storageweb/config.example.json
    file_info:
      mode: 0644

  - src: packaging/nginx/storageweb.conf
    dst: /usr/share/storageweb/nginx-storageweb.conf
    file_info:
      mode: 0644

  - src: README.md
    dst: /usr/share/doc/storageweb/README.md
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
