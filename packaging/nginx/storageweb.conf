# /etc/nginx/sites-available/storageweb
# Proxy inverso HTTPS delante de StorageWeb (Entra ID exige HTTPS en la redirect URI).
# Certificado: sudo certbot --nginx -d files.midominio.com
# Equivale a packaging/apache/storageweb.conf.

server {
    listen 80;
    server_name files.midominio.com;
    # Todo HTTP → HTTPS, con el mismo nombre, ruta y consulta
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name files.midominio.com;
    # No anunciar la versión de nginx (en páginas de error y en la cabecera Server)
    server_tokens off;

    # Logs propios del sitio, sin mezclarlos con los de otros del mismo nginx
    access_log /var/log/nginx/storageweb.access.log;
    error_log  /var/log/nginx/storageweb.error.log;

    ssl_certificate     /etc/letsencrypt/live/files.midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.midominio.com/privkey.pem;
    # Solo TLS 1.2 y 1.3 (los anteriores son inseguros; es lo que hace nginx por defecto desde la 1.23.4)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Tamaño máximo de cada petición. Las subidas desde el navegador van en partes de hasta 32 MB,
    # así que el tamaño del archivo no depende de este valor; solo afecta a la subida clásica sin
    # JavaScript y a la unidad de red (WebDAV), que usan server.max_upload_mb (pon aquí un valor >= ese).
    client_max_body_size 2100m;
    client_body_timeout 300s;

    # Subidas: no bufferizar en el disco de nginx, pasar directo a la app
    proxy_request_buffering off;
    # Descargas: streaming directo, sin límite de tamaño (por defecto nginx usa un temporal de 1 GB)
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    # Son tiempos de inactividad entre lecturas/escrituras, no de duración total
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        # La subruta solo la dice el proxy: vacía = no se envía (se quita la que mandara el cliente). Bajo una
        # subruta (location /archivos/ { proxy_pass http://127.0.0.1:8080/; … }), pon aquí "/archivos".
        proxy_set_header X-Forwarded-Prefix "";
    }
}
