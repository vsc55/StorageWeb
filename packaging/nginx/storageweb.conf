# /etc/nginx/sites-available/storageweb
# Proxy inverso HTTPS delante de StorageWeb (Entra ID exige HTTPS en la redirect URI).
# Certificado: sudo certbot --nginx -d files.midominio.com

server {
    listen 80;
    server_name files.midominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name files.midominio.com;

    ssl_certificate     /etc/letsencrypt/live/files.midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.midominio.com/privkey.pem;

    # Tamaño máximo de cada petición. Las subidas desde el navegador van en partes de hasta 32 MB,
    # así que el tamaño del archivo no depende de este valor; solo afecta a la subida clásica sin
    # JavaScript, que usa server.max_upload_mb (pon aquí un valor >= ese).
    client_max_body_size 2100m;
    client_body_timeout 300s;

    # Subidas: no bufferizar en el disco de nginx, pasar directo a la app
    proxy_request_buffering off;
    # Descargas: streaming directo, sin límite de tamaño (por defecto nginx usa un temporal de 1 GB)
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    # Son tiempos de inactividad entre lecturas/escrituras, no de duración total
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}
