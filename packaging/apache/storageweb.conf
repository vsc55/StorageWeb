# Apache 2.4: proxy inverso HTTPS delante de StorageWeb (Entra ID exige HTTPS en la redirect URI).
#
# Debian/Ubuntu: /etc/apache2/sites-available/storageweb.conf
#   sudo a2enmod proxy proxy_http ssl headers http2 reqtimeout rewrite
#   sudo a2ensite storageweb && sudo certbot --apache -d files.midominio.com
# RHEL/Fedora/Rocky: /etc/httpd/conf.d/storageweb.conf (paquetes httpd mod_ssl; los módulos ya vienen cargados)
#   Cambia las rutas de los logs (abajo) a /var/log/httpd/.
#   sudo certbot --apache -d files.midominio.com
#   SELinux: sudo setsebool -P httpd_can_network_connect 1   (para que Apache pueda conectar con 127.0.0.1:8080)
#
# Cambia files.midominio.com por tu nombre. Equivale a packaging/nginx/storageweb.conf.
#
# En la configuración global (no en el VirtualHost; Debian: /etc/apache2/conf-available/security.conf), para
# no anunciar la versión de Apache ni del sistema:
#   ServerTokens Prod
#   ServerSignature Off

# Todo HTTP → HTTPS, con el mismo nombre por el que entró el usuario (ServerName o cualquier ServerAlias, sin
# repetir aquí el FQDN), la misma ruta y la misma consulta (http://…/f/home?x=1 → https://…/f/home?x=1).
# %{SERVER_NAME} y no %{HTTP_HOST}: este lleva el puerto si el cliente lo envía (files…:80 → https://files…:80/).
# Después, la cabecera HSTS que envía StorageWeb hace que el navegador no vuelva a pedir por HTTP.
<VirtualHost *:80>
    ServerName files.midominio.com
    # ServerAlias archivos.midominio.com
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName files.midominio.com
    # ServerAlias archivos.midominio.com
    ServerSignature Off

    # Logs propios del sitio, sin mezclarlos con los de otros del mismo Apache (RHEL: /var/log/httpd/…)
    ErrorLog  /var/log/apache2/storageweb-error.log
    CustomLog /var/log/apache2/storageweb-access.log combined

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/files.midominio.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/files.midominio.com/privkey.pem
    # Solo TLS 1.2 y 1.3 (los anteriores son inseguros). Si usas certbot --apache, también puedes cambiar estas
    # dos líneas por «Include /etc/letsencrypt/options-ssl-apache.conf», que certbot mantiene al día.
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    # HTTP/2. Con mpm_prefork (habitual si está instalado mod_php) no tiene efecto y Apache no avisa:
    # «apachectl -V | grep MPM»; para usar mpm_event: a2dismod mpm_prefork && a2enmod mpm_event (Debian).
    <IfModule mod_http2.c>
        Protocols h2 http/1.1
    </IfModule>

    # Tamaño máximo de cada petición. Las subidas desde el navegador van en partes de hasta 32 MB, así que el
    # tamaño del archivo no depende de este valor; sí la subida clásica sin JavaScript y la unidad de red
    # (WebDAV), que usan una petición por archivo: pon un valor >= server.max_upload_mb (en bytes).
    # Desde Apache 2.4.54 el límite por defecto es 1 GB. Como mucho 2147483647; 0 = sin límite.
    LimitRequestBody 2147483647

    # Tiempos de inactividad (no de duración total) con la aplicación y con el cliente
    Timeout 300
    ProxyTimeout 300
    # mod_reqtimeout corta por defecto a los 20 s una subida lenta: más margen para el cuerpo de la petición
    <IfModule mod_reqtimeout.c>
        RequestReadTimeout header=20-40,MinRate=500 body=300,MinRate=1
    </IfModule>

    # Proxy hacia Waitress. nocanon + AllowEncodedSlashes: las rutas llegan tal cual a la aplicación (nombres con
    # %, #, ?, espacios…); la aplicación las valida. Los métodos de WebDAV (PROPFIND, MOVE, LOCK…) pasan sin más.
    AllowEncodedSlashes NoDecode
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/ nocanon
    ProxyPassReverse / http://127.0.0.1:8080/

    # Subidas y descargas van en streaming: Apache reenvía el cuerpo con su Content-Length y no guarda las
    # descargas en disco (a diferencia de nginx, no hace falta desactivar ningún buffer). No pongas
    # «SetEnv proxy-sendchunked»: la aplicación necesita el tamaño para rechazar de entrada un archivo demasiado
    # grande o sin espacio en disco.

    # X-Forwarded-For y X-Forwarded-Host los añade mod_proxy. Con server.behind_proxy = true y
    # server.proxy_hops = 1, la aplicación solo confía en el último valor (el que pone Apache).
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
    # La subruta solo la dice el proxy: se quita la que pudiera mandar el cliente (si no, la aplicación la
    # usaría en sus enlaces). Bajo una subruta (https://www.midominio.com/archivos/): ProxyPass y
    # ProxyPassReverse con /archivos/ y, en lugar de «unset», RequestHeader set X-Forwarded-Prefix "/archivos".
    RequestHeader unset X-Forwarded-Prefix

    # Las cabeceras de seguridad (CSP, HSTS…) las pone StorageWeb; no hace falta repetirlas aquí.
</VirtualHost>
