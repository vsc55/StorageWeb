# /etc/nginx/sites-available/storageweb
# Proxy inverso HTTPS delante de StorageWeb (Entra ID exige HTTPS en la redirect URI).
# Certificado: sudo certbot --nginx -d files.midominio.com

server {
    listen 80;
    server_name files.midominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name files.midominio.com;

    ssl_certificate     /etc/letsencrypt/live/files.midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.midominio.com/privkey.pem;

    # Debe ser >= server.max_upload_mb de config.json
    client_max_body_size 2100m;
    client_body_timeout 300s;

    # Para subidas grandes: no bufferizar en disco de nginx, pasar directo a la app
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}
