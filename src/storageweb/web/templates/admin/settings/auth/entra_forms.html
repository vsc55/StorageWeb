{# Formularios de Entra ID fuera del formulario principal (renovar secreto, conceder grupos, probar). #}
<form id="entra-rotate-form" method="post" action="{{ url_for('settings.entra_rotate') }}" hidden class="js-confirm"
      data-confirm="{{ _('Create a new client secret? You will sign in with Microsoft to authorize it; the current one keeps working until it expires.') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
</form>
<form id="entra-groups-form" method="post" action="{{ url_for('settings.entra_grant_groups') }}" hidden>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
</form>
<form id="entra-test-form" method="post" action="{{ url_for('settings.entra_test') }}" hidden>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ request.path }}">
</form>
