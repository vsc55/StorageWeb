{% extends "admin/settings/_layout.html" %}
{% from "admin/settings/_macros.html" import origin, err_class, field_error, form_start, save_bar, lock with context %}
{% block section %}
{% set st = cfg.storage %}
{{ form_start() }}
  <div class="card form-grid">
    <label class="span2{{ err_class('storage.home_location') }}"><span class="label-row">{{ _("Where personal folders live") }} {{ origin('storage.home_location') }}</span>
      <select{{ lock('storage.home_location') }} name="home_location">
        <option value="">{{ _("Disk of the server") }}</option>
        {% for loc in st.locations %}<option value="{{ loc.name }}" {% if st.home_location == loc.name %}selected{% endif %}>{{ loc.label }} · {{ location_type(loc.type).short_label }}</option>{% endfor %}
      </select>
      <small class="muted">{% if st.locations %}{{ _("In a storage location the template is a folder inside it, for example homes/{username}.") }}
        <a href="{{ url_for('locations.index') }}">{{ _("Storage locations") }}</a>
        {% else %}{{ _("Mounted folders (NFS, SMB, rclone) are on the disk. For S3 or SMB without mounting,") }} <a href="{{ url_for('locations.index') }}">{{ _("add a storage location") }}</a>.{% endif %}</small>
      {{ field_error('storage.home_location') }}</label>
    <label class="span2{{ err_class('storage.home_template') }}"><span class="label-row">{{ _("Personal folder template") }} {{ origin('storage.home_template') }}</span>
      <input{{ lock('storage.home_template') }} type="text" name="home_template" value="{{ st.home_template }}" required class="mono">
      <small class="muted">{{ _("Must contain {username}, which is replaced by the user name.") }}</small>
      {{ field_error('storage.home_template') }}</label>
    <label class="check"><input{{ lock('storage.create_home') }} type="checkbox" name="create_home" {% if st.create_home %}checked{% endif %}> {{ _("Create the personal folder on first access") }} {{ origin('storage.create_home') }}</label>
    <label class="check"><input{{ lock('storage.create_shares') }} type="checkbox" name="create_shares" {% if st.create_shares %}checked{% endif %}> {{ _("Create shared folders if they do not exist") }} {{ origin('storage.create_shares') }}</label>
    <label class="check"><input{{ lock('storage.show_hidden') }} type="checkbox" name="show_hidden" {% if st.show_hidden %}checked{% endif %}> {{ _("Show hidden files") }} {{ origin('storage.show_hidden') }}</label>
    <label class="{{ err_class('storage.max_file_size_mb') }}"><span class="label-row">{{ _("Maximum size per file (MB)") }} {{ origin('storage.max_file_size_mb') }}</span>
      <input{{ lock('storage.max_file_size_mb') }} type="number" name="max_file_size_mb" value="{{ st.max_file_size_mb }}" min="0">
      <small class="muted">{{ _("0 = no limit; uploads are sent in parts") }}</small>
      {{ field_error('storage.max_file_size_mb') }}</label>
    <label class="{{ err_class('storage.home_quota_mb') }}"><span class="label-row">{{ _("Quota of personal folders (MB)") }} {{ origin('storage.home_quota_mb') }}</span>
      <input{{ lock('storage.home_quota_mb') }} type="number" name="home_quota_mb" value="{{ st.home_quota_mb }}" min="0">
      <small class="muted">{{ _("0 = no quota. It only warns (from 90%% and when exceeded); it does not stop uploads. Each user can have another one in their profile.") }}</small>
      {{ field_error('storage.home_quota_mb') }}</label>
    <label class="span2 {{ err_class('storage.hidden') }}"><span class="label-row">{{ _("Hidden for everyone") }} {{ origin('storage.hidden') }}</span>
      <textarea{{ lock('storage.hidden') }} name="hidden" rows="5" class="mono" spellcheck="false" placeholder="Thumbs.db&#10;desktop.ini&#10;.DS_Store&#10;*.tmp&#10;.git/">{{ st.hidden|join('\n') }}</textarea>
      <small class="muted">{{ _("One pattern per line, like .gitignore: «Thumbs.db» or «*.tmp» anywhere, «.git/» only folders, «/private» from the root of each folder. They are not listed and cannot be opened or created (web, network drive and API); the files stay on disk.") }}</small>
      {{ field_error('storage.hidden') }}</label>
  </div>
  {{ save_bar() }}
</form>
{% endblock %}
