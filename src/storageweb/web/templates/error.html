{% extends "base.html" %}
{% block title %}{{ _("Error %(code)s", code=code) }} · {{ app_name }}{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ code }} · {{ name }}</h1>
  <p>{{ description }}</p>
  <p><a class="btn" href="{{ url_for('files.index') }}">{{ _("Back to start") }}</a></p>
</section>
{% endblock %}
