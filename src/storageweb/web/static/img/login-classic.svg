<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Ilustración de serie del inicio de sesión: fondo transparente; el color lo pone el CSS (.login-aside) -->
  <defs>
    <radialGradient id="glow" cx="72%" cy="22%" r="65%">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#fff" fill-opacity=".10"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#dots)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="2">
    <circle cx="580" cy="230" r="170"/>
    <circle cx="580" cy="230" r="280"/>
    <circle cx="580" cy="230" r="400"/>
    <circle cx="580" cy="230" r="530"/>
  </g>
  <!-- carpeta grande -->
  <g transform="translate(170 400) rotate(-7)">
    <path d="M0 34a18 18 0 0 1 18-18h96l28 28h218a18 18 0 0 1 18 18v214a18 18 0 0 1-18 18H18A18 18 0 0 1 0 276z"
          fill="url(#card)" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <path d="M0 80h378" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
  </g>
  <!-- documento -->
  <g transform="translate(470 330) rotate(9)">
    <path d="M0 16A16 16 0 0 1 16 0h120l48 48v196a16 16 0 0 1-16 16H16A16 16 0 0 1 0 244z"
          fill="url(#card)" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <path d="M136 0v32a16 16 0 0 0 16 16h32" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <g stroke="#fff" stroke-opacity=".30" stroke-width="8" stroke-linecap="round">
      <path d="M32 96h120M32 128h96M32 160h120M32 192h64"/>
    </g>
  </g>
  <!-- imagen -->
  <g transform="translate(300 690) rotate(-3)">
    <rect width="220" height="160" rx="16" fill="url(#card)" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="160" cy="48" r="18" fill="#fff" fill-opacity=".35"/>
    <path d="M20 140l56-64 44 46 28-30 52 48z" fill="#fff" fill-opacity=".25"/>
  </g>
  <!-- nube con flecha de subida -->
  <g transform="translate(110 170)" fill="none" stroke="#fff" stroke-opacity=".40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 120h104a40 40 0 0 0 4-80 56 56 0 0 0-106-10A46 46 0 0 0 44 120z" fill="#fff" fill-opacity=".08"/>
    <path d="M96 104V60M78 78l18-18 18 18"/>
  </g>
  <!-- puntos sueltos -->
  <g fill="#fff">
    <circle cx="680" cy="720" r="6" fill-opacity=".35"/>
    <circle cx="120" cy="620" r="4" fill-opacity=".30"/>
    <circle cx="640" cy="880" r="10" fill-opacity=".15"/>
    <circle cx="90" cy="900" r="14" fill-opacity=".10"/>
  </g>
</svg>
