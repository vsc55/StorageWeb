name: CI

on:
  push:
    branches: [main, master]
    tags-ignore: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Pytest
        run: python -m pytest -q

  scripts:
    name: Scripts de despliegue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis bash/sh
        run: |
          for f in deploy/*.sh packaging/*.sh deploy/storageweb-admin; do
            echo "-> $f"; bash -n "$f"
          done
      - name: ShellCheck (errores)
        run: shellcheck --severity=error deploy/*.sh packaging/*.sh deploy/storageweb-admin
      - name: JSON válido
        run: |
          python3 -m json.tool config/config.example.json > /dev/null
          python3 -m json.tool config/config.dev.json > /dev/null
