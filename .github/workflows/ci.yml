name: CI

on:
  push:
    branches: [main, master]
    tags-ignore: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Solo la última versión de Python; las anteriores que admite pyproject (requires-python) no se prueban
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar el paquete (editable) con dependencias de desarrollo
        run: python -m pip install -e ".[dev]"

      - name: Pytest
        run: python -m pytest -q
        env:
          # Tests de navegador (tests/browser, con Chrome sin ventana): en Linux son obligatorios, así que si
          # faltan Node o Chrome falla en vez de omitirlos; en Windows y macOS se hacen si están (suelen estar)
          STORAGEWEB_REQUIRE_BROWSER: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  scripts:
    name: Scripts de despliegue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis bash/sh
        run: |
          for f in packaging/*.sh packaging/scripts/*.sh packaging/bin/storageweb-admin packaging/docker/entrypoint.sh \
                   packaging/gentoo/*/*/*.ebuild* packaging/gentoo/www-apps/storageweb/files/storageweb.initd; do
            echo "-> $f"; bash -n "$f"
          done
      - name: ShellCheck (errores)
        run: shellcheck --severity=error packaging/*.sh packaging/scripts/*.sh packaging/bin/storageweb-admin packaging/docker/entrypoint.sh
      - name: JSON válido
        run: |
          python3 -m json.tool config/config.example.json > /dev/null
          python3 -m json.tool config/config.dev.json > /dev/null

  wheel:
    name: Wheel instalable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir e instalar el wheel en un venv limpio
        run: |
          python -m pip wheel --no-deps -w dist .
          unzip -l dist/storageweb-*.whl | grep -E "templates/base.html|static/js/app.js|migrations/001_initial.sql"
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/storageweb-*.whl
          cd /tmp
          /tmp/venv/bin/storageweb --help
          printf '{"data_dir": "/tmp/sw", "storage": {"home_template": "/tmp/sw/homes/{username}"}}' > /tmp/sw.json
          /tmp/venv/bin/storageweb --config /tmp/sw.json user-add ci --role admin --password ci-password-123
          /tmp/venv/bin/storageweb --config /tmp/sw.json check-config

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build --build-arg VERSION=0.0.0+ci -t storageweb:ci .
      - name: Arrancar y comprobar
        run: |
          printf 'clave-de-prueba-123' > /tmp/pw
          docker run -d --name sw -p 8080:8080 \
            -e STORAGEWEB_COOKIE_SECURE=false -e STORAGEWEB_BEHIND_PROXY=false \
            -e STORAGEWEB_ADMIN_USER=admin -e STORAGEWEB_ADMIN_PASSWORD_FILE=/run/pw \
            -v /tmp/pw:/run/pw:ro storageweb:ci
          for i in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' sw)" = healthy ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' sw | grep -qx healthy
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"0.0.0+ci"'
          curl -fsS -H 'Accept-Language: es' http://127.0.0.1:8080/login | grep -q 'Iniciar sesión'
          docker exec sw storageweb user-list | grep -q '^admin .* admin '
          test "$(docker exec sw id -u)" = 10001
          # Al reiniciar no se duplica el admin ni se pierde la configuración
          docker restart sw
          sleep 5
          test "$(docker exec sw storageweb user-list | grep -c '^admin ')" = 1
      - name: Logs del contenedor
        if: failure()
        run: docker logs sw || true

  vscode:
    name: Extensión de VS Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Sin npm ni pnpm: la extensión no tiene dependencias
      - name: Tests del motor de sincronización (Node)
        # Ficheros explícitos: desde Node 22, un directorio como argumento de --test no se recorre
        run: node --test clients/vscode/test/*.test.js
      - name: Contra un StorageWeb real (dos equipos sincronizando)
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/integration/test_vscode_extension.py -rs
      - name: Empaquetar el .vsix
        run: |
          python tools/build_vsix.py --out dist
          unzip -l dist/storageweb-sync-*.vsix | grep -E "extension.vsixmanifest|extension/package.json|extension/src/extension.js"
      - uses: actions/upload-artifact@v4
        with:
          name: storageweb-vscode
          path: dist/*.vsix
          if-no-files-found: error

  docs:
    name: Documentación y traducciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: python -m pip install -e ".[docs]"
      - name: Traducciones completas y al día
        run: python tools/i18n.py check
      - name: Referencia generada al día
        run: python tools/gen_docs.py --check
      - name: Construir (estricto)
        run: mkdocs build --strict
