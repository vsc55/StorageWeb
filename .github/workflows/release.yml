name: Release

# Al publicar un tag vX.Y.Z (p. ej. `git tag v1.2.0 && git push origin v1.2.0`) se ejecutan los tests,
# se generan wheel, zip, tar.gz, deb, rpm, el overlay de Gentoo y la extensión de VS Code (.vsix, con
# su propia versión), se publica la imagen Docker en
# ghcr.io/<owner>/<repo>, se publica la documentación en GitHub Pages y se crea la release de GitHub.
# También se puede lanzar a mano (Actions > Release > Run workflow) para probar el build sin publicar.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión para el build de prueba (no se publica release)"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build wheel / zip / deb / rpm / Gentoo
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determinar versión
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="$INPUT_VERSION"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Versión no válida: '$V' (se espera X.Y.Z o X.Y.Z-sufijo)"; exit 1
          fi
          # Las notas de la release salen del CHANGELOG: sin su sección no se publica nada
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] && ! python tools/release_notes.py "$V" --check; then
            echo "::error::CHANGELOG.md no tiene la sección «## [$V]»"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Instalar nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq nfpm rpm
          nfpm --version

      - name: Build
        env:
          MAINTAINER: "${{ github.repository_owner }} <noreply@github.com>"
          VENDOR: ${{ github.repository_owner }}
          HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
        run: bash packaging/build.sh "${{ steps.version.outputs.version }}" amd64 arm64

      - name: Extensión de VS Code (.vsix)
        # Con su propia versión (clients/vscode/package.json), no la de StorageWeb
        run: |
          python tools/build_vsix.py --out dist
          EXT=$(python -c "import json; print(json.load(open('clients/vscode/package.json'))['version'])")
          unzip -p "dist/storageweb-sync-$EXT.vsix" extension/package.json | grep -q "\"version\": \"$EXT\""

      - name: Inspeccionar paquetes
        run: |
          # sed lee toda la salida: con head, el listado se corta, dpkg-deb/rpm reciben SIGPIPE y pipefail
          # da el paso por fallido aunque el paquete esté bien
          for f in dist/*.deb; do echo "== $f"; dpkg-deb --info "$f"; dpkg-deb -c "$f" | sed -n '1,25p'; done
          for f in dist/*.rpm; do echo "== $f"; rpm -qip "$f"; rpm -qlp "$f" | sed -n '1,25p'; done
          V="${{ steps.version.outputs.version }}"
          tar -tzf "dist/storageweb-gentoo-overlay-$V.tar.gz"
          tar -xzf "dist/storageweb-gentoo-overlay-$V.tar.gz" -O --wildcards '*/Manifest'

      - name: Probar instalación del .deb (amd64)
        run: |
          V="${{ steps.version.outputs.version }}"
          sudo apt-get install -y ./dist/storageweb_${V}_amd64.deb
          systemctl is-active storageweb
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/login && break; sleep 1; done
          curl -fsS -H 'Accept-Language: es' http://127.0.0.1:8080/login | grep -q 'Iniciar sesión'  # sale en inglés por defecto
          sudo storageweb-admin user-add ci --role admin --password contraseña-de-prueba
          sudo storageweb-admin user-list | grep -q '^ci .* admin '
          sudo storageweb-admin check-config
          sudo apt-get remove -y storageweb
          ! systemctl is-active storageweb

      - uses: actions/upload-artifact@v4
        with:
          name: storageweb-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  docker:
    name: Imagen Docker (amd64 + arm64)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.build.outputs.version }},enable=${{ github.ref_type != 'tag' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.build.outputs.version }}
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gentoo:
    name: Probar ebuild en Gentoo (informativo)
    needs: build
    runs-on: ubuntu-latest
    # No bloquea la release: depende de la disponibilidad de paquetes binarios de Gentoo
    continue-on-error: true
    container: gentoo/stage3:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: storageweb-${{ needs.build.outputs.version }}
          path: dist
      - name: emerge www-apps/storageweb
        env:
          V: ${{ needs.build.outputs.version }}
          FEATURES: "-sandbox -usersandbox -ipc-sandbox -network-sandbox -pid-sandbox getbinpkg"
        run: |
          emerge-webrsync -q
          mkdir -p /var/db/repos /etc/portage/repos.conf /etc/portage/package.accept_keywords \
                   /var/cache/distfiles
          tar -xzf "dist/storageweb-gentoo-overlay-$V.tar.gz" -C /var/db/repos
          printf '[storageweb]\nlocation = /var/db/repos/storageweb-overlay\n' > /etc/portage/repos.conf/storageweb.conf
          echo 'www-apps/storageweb ~amd64' > /etc/portage/package.accept_keywords/storageweb
          cp "dist/storageweb-$V.tar.gz" /var/cache/distfiles/
          emerge --quiet-build --getbinpkg www-apps/storageweb
          storageweb --help
          storageweb --config /etc/storageweb/config.json check-config

  docs:
    name: Publicar documentación (GitHub Pages)
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m pip install -e ".[docs]"
          sed -i "s/^site_name: StorageWeb$/site_name: StorageWeb $VERSION/" mkdocs.yml
          mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Publicar release
    needs: [build, docker]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: storageweb-${{ needs.build.outputs.version }}
          path: dist

      - name: Crear o actualizar la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          FLAGS=()
          [[ "$VERSION" == *-* ]] && FLAGS+=(--prerelease)
          # El texto de la release es la sección de esta versión del CHANGELOG.md
          python3 tools/release_notes.py "$VERSION" > "$RUNNER_TEMP/notas.md"
          REPO=(--repo "$GITHUB_REPOSITORY")
          if gh release view "$GITHUB_REF_NAME" "${REPO[@]}" > /dev/null 2>&1; then
            # Ya existe (se ha movido el tag a otro commit): texto y ficheros nuevos, y fuera los que ya no se generan
            gh release edit "$GITHUB_REF_NAME" "${REPO[@]}" --title "StorageWeb $VERSION" \
              --notes-file "$RUNNER_TEMP/notas.md" "${FLAGS[@]}"
            gh release view "$GITHUB_REF_NAME" "${REPO[@]}" --json assets --jq '.assets[].name' | while read -r old; do
              [[ -e "dist/$old" ]] || gh release delete-asset "$GITHUB_REF_NAME" "$old" "${REPO[@]}" --yes
            done
            gh release upload "$GITHUB_REF_NAME" dist/* "${REPO[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* "${REPO[@]}" \
              --title "StorageWeb $VERSION" \
              --notes-file "$RUNNER_TEMP/notas.md" \
              --verify-tag \
              "${FLAGS[@]}"
          fi
