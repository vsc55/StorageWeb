# docker compose up -d   →  http://localhost:8080
#
# Para desarrollo: compila la imagen con el código de este repositorio.
# En producción pon delante un proxy con HTTPS (Entra ID lo exige). Listos para usar, sin el código:
#   packaging/docker/compose.caddy.yaml     (lo más sencillo)
#   packaging/docker/compose.traefik.yaml
# Ver docs/administracion/docker.md.
# Para probar en http://localhost sin HTTPS: STORAGEWEB_COOKIE_SECURE=false y STORAGEWEB_BEHIND_PROXY=false
# (solo se aplican al generar /data/config.json la primera vez).
services:
  storageweb:
    image: ghcr.io/vsc55/storageweb:latest   # sin «build», usa la publicada
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      STORAGEWEB_ADMIN_USER: admin
      STORAGEWEB_ADMIN_PASSWORD_FILE: /run/secrets/storageweb_admin_password
      STORAGEWEB_BEHIND_PROXY: "true"
      STORAGEWEB_COOKIE_SECURE: "true"
    secrets:
      - storageweb_admin_password
    volumes:
      - storageweb-data:/data
      # Para usar carpetas del host como almacenamiento, móntalas y añádelas como carpetas
      # compartidas en Administración → Ajustes (el contenedor corre con uid/gid 10001):
      # - /srv/archivos:/data/files

secrets:
  storageweb_admin_password:
    file: ./admin_password.txt   # créalo con: printf 'una-clave-larga' > admin_password.txt

volumes:
  storageweb-data:
