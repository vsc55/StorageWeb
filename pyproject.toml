[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storageweb"
dynamic = ["version"]
description = "Servidor web para subir y descargar archivos con usuarios locales, PAM y Microsoft Entra ID"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Babel>=2.12,<3",
    "Flask>=3.0,<4",
    "Werkzeug>=3.0,<4",
    "waitress>=3.0,<4",
    "msal>=1.28,<2",
    "cryptography>=42",  # cifrado de los secretos guardados (ya la trae msal)
    "python-pam>=2.0,<3; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyyaml>=6"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "pyyaml>=6"]
# Almacenamiento externo nativo (docs/administracion/almacenamiento.md)
s3 = ["boto3>=1.28"]
smb = ["smbprotocol>=1.12"]
sftp = ["paramiko>=3.4"]
azure = ["azure-storage-blob>=12.19"]
# FTP/FTPS y WebDAV no necesitan nada (biblioteca estándar)

[project.scripts]
storageweb = "storageweb.cli:main"

[tool.setuptools.dynamic]
version = { attr = "storageweb.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
storageweb = ["web/templates/*.html", "web/templates/**/*.html", "web/static/**/*",
              "db/migrations/*.sql", "locale/*/LC_MESSAGES/*.po"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
