      - HTTPS con nginx, Apache o Caddy: administracion/https.md
      - Windows: administracion/windows.md
      - Configuración: administracion/configuracion.md
      - Microsoft Entra ID: administracion/entra-id.md
      - Usuarios, roles y permisos: administracion/usuarios-y-permisos.md
      - Almacenamiento externo: administracion/almacenamiento.md
      - Copias de seguridad: administracion/copias-seguridad.md
